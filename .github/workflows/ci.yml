# Fork-only validation recipe. Never part of the upstream feature PR.
# The product checkout is the immutable published feature commit, not this QA branch.
name: Provider native QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUST_TEST_THREADS: "1"
      WGPU_BACKEND: vulkan
      EXPECTED_SOURCE_SHA: "4fceaccbdad2b6c38d87ad66e5c279b92b5eb128"
      CARGO_CACHE_AUTO_CLEAN_FREQUENCY: "never"
      NEXTEST_TEST_THREADS: "1"
      RUST_BACKTRACE: "1"
      PDFCRAFT_ORACLES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "4fceaccbdad2b6c38d87ad66e5c279b92b5eb128"
          persist-credentials: false
      - name: Prepare runtime environment before tool setup
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/acp-qa "$RUNNER_TEMP/provider-runtime" "$RUNNER_TEMP/provider-config" "$RUNNER_TEMP/provider-data" "$RUNNER_TEMP/provider-cache" "$RUNNER_TEMP/provider-evidence" "$RUNNER_TEMP/provider-native-target"
          {
            echo "TMPDIR=/tmp/acp-qa"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/provider-native-target"
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/provider-runtime"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/provider-config"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/provider-data"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/provider-cache"
            echo "EVIDENCE_DIR=$RUNNER_TEMP/provider-evidence"
            echo "CRAFT_PROVIDER_UI_FIXTURES=$RUNNER_TEMP/provider-evidence"
            echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts"
            echo "CRAFT_FONTS_REQUIRED=1"
          } >> "$GITHUB_ENV"
      - name: Free unused SDK space on disposable hosted runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: "b076417b5880bd4154bd22f00695b1d28c6bea83"
          path: craft-fonts
          persist-credentials: false
      - name: Install existing native build prerequisites
        uses: storytold/craft-common-actions/actions/install-apt-packages@44a7db40b1a3e99eed02c88f89f38cdd6cfffe81
        with:
          packages: "pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers libgl1-mesa-dev libvulkan1 libgtk-3-dev qpdf poppler-utils"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: "cargo-deny@0.20.2"
      - name: Prepare isolated native runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          install -d -m 700 "$TMPDIR" "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$EVIDENCE_DIR"
          mkdir -p qa-output artifacts
      - name: "Format"
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m cargo fmt --all -- --check
      - name: "Clippy touched packages"
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m cargo clippy --locked -p pdfcraft-engine -p pdfcraft-ui-egui -p pdfcraft-web -p pdfcraft --all-targets -j2 -- -D warnings
      - name: "Full affected native tests"
        shell: bash
        run: |
          set -euo pipefail
          timeout 45m cargo test --locked -p pdfcraft-engine -p pdfcraft-ui-egui -p pdfcraft-web --lib --bins --tests -j2 -- --test-threads=1
      - name: "Affected doctests and minimal CLI"
        shell: bash
        run: |
          set -euo pipefail
          timeout 20m cargo test --locked -p pdfcraft-engine -p pdfcraft-ui-egui --doc -j2
          timeout 20m cargo check --locked -p pdfcraft-cli --no-default-features -j2
      - name: "Structural and dependency gates"
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m cargo xtask layers
          timeout 5m cargo xtask assets
          timeout 10m cargo xtask license-check
          timeout 10m cargo xtask parity
          timeout 10m cargo xtask deny
          timeout 10m cargo xtask i18n-report
      - name: "App and crate WASM"
        shell: bash
        run: |
          set -euo pipefail
          timeout 30m cargo check --locked -p pdfcraft-web --target wasm32-unknown-unknown -j2
          timeout 30m cargo xtask wasm
      - name: "Capture actual PDF Home"
        shell: bash
        run: |
          set -euo pipefail
          timeout 30m cargo run --locked -p pdfcraft-ui-egui --example shot -- qa-output/pdfcraft-default-4fceaccb.png --size 1440x900 --scale 1
          timeout 5m cargo run --locked -p pdfcraft-ui-egui --example shot -- qa-output/pdfcraft-provider-4fceaccb.png --file-provider-preview --size 1440x900 --scale 1
      - name: Verify native evidence and source identity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, struct, subprocess
          expected = os.environ['EXPECTED_SOURCE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          out = pathlib.Path(os.environ['EVIDENCE_DIR'])
          fonts_sha = subprocess.check_output(['git','-C','craft-fonts','rev-parse','HEAD'],text=True).strip() if pathlib.Path('craft-fonts/.git').exists() else None
          assert fonts_sha == "b076417b5880bd4154bd22f00695b1d28c6bea83"
          rustc = subprocess.check_output(['rustc','-Vv'],text=True)
          files = ["qa-output/pdfcraft-default-4fceaccb.png","qa-output/pdfcraft-provider-4fceaccb.png"]
          assert len(files) == 2
          proof = []
          for raw in files:
              source = pathlib.Path(os.path.expandvars(raw))
              data = source.read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10]) and len(data)>1000, str(source)
              width, height = struct.unpack('>II', data[16:24])
              assert width>=300 and height>=300, (width,height)
              target = out / source.name
              if source.resolve() != target.resolve(): shutil.copy2(source,target)
              proof.append(dict(file=target.name,width=width,height=height,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          provenance = dict(source_sha=actual,fonts_sha=fonts_sha,rustc=rustc,workflow_sha=os.environ.get('GITHUB_SHA'),run_id=os.environ.get('GITHUB_RUN_ID'),renderer='repository native offscreen renderer; synthetic resources',browser_backend_e2e=False,images=proof)
          (out / 'provenance.json').write_text(json.dumps(provenance,indent=2)+chr(10))
          print(json.dumps(provenance))
          PY
      - name: Upload two native captures and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: provider-ui-pdfcraft-4fceaccbdad2
          path: |
            ${{ runner.temp }}/provider-evidence/pdfcraft-default-4fceaccb.png
            ${{ runner.temp }}/provider-evidence/pdfcraft-provider-4fceaccb.png
            ${{ runner.temp }}/provider-evidence/provenance.json
          if-no-files-found: error
          retention-days: 14
